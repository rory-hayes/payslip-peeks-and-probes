name: Verify web app

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, lint, and Lovable-parity build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      # Lovable's GitHub builder does not reliably provide VITE_* values from
      # the connected backend. Keep this job free of Supabase build variables
      # so every push proves the reviewed low-privilege browser fallback and
      # the conventional dist/ artifact under the same condition.
      - name: Verify the web release artifact without host variables
        run: npm run verify

  verify-mobile:
    name: Verify mobile app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Verify the mobile web artifact
        run: npm run verify
